<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table ,th ,td ,tr ,tbody , thead {
            border-collapse: collapse;  
            border: 1px solid black;
            padding: 10px;    
        }
    </style>
</head>
<body>
       <div id="rechargeCard"> 
    <section>
        <main class="d-flex">
            <div>
                <label class="d-block" for="">Select a Provider</label>
                <select class="form-select" name="" id="provider">
                    <option value="">Select a Provider</option>
                    <option value="MTN">MTN</option>
                    <option value="Airtel">Airtel</option>
                    <option value="9mobile">9mobile</option>
                    <option value="Glo">Glo</option>
                </select>
            </div>
    
            <div>
                <label class="d-block" for="">Select Price</label>
                <select class="form-select" name="" id="amount">
                    <option value="">Select a Price</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
           
        </main>
        <div>
                <h4> pin: <span id="myPin"> </span></h4>
            </div>
        <button onclick="genAirtime()" class="btn btn-success">Generate Airtime</button>


    </section>

    <section>
        <h4>Load Airtime</h4>
        <input id="loadInput" type="text" value="*311*pin#">
        <button onclick="loadAirtime()">Load airtime</button>
    </section>

     <div>
                <h4>Balance: <span id="bal"> </span></h4>
            </div>

    <section>
        <div> <button onclick="displayCards()"> all cards</button> <button onclick="usedCards()"> used cards</button> <button onclick="unusedCards()"> unused cards</button> </div>
        <br>
        <table id="table">
            <thead id="thead">
                <th>s/n</th>
                <th>Pin</th>
                <th>Status</th>
                <th>Provider</th>
                <th>Amount</th>
            </thead>
            <tbody id="tbody">

    
            </tbody>
        </table>
    </section>
</div>
    
</body>
</html>
<script>
let cardData = JSON.parse(localStorage.getItem('mayRechargeCards')) || []
let cardPin = document.getElementById('myPin')
let cardProvider = document.getElementById('provider')
let cardAmount = document.getElementById('amount')
let balSpan = document.getElementById('bal')
let tbody = document.getElementById('tbody')
let loadInput = document.getElementById('loadInput')
let providerValue = ''
let amountValue = ''
let balance = JSON.parse(localStorage.getItem('mayRechargeBalance'))  || 0 

balSpan.innerHTML = balance


function genAirtime() {
    providerValue = cardProvider.value
    amountValue =cardAmount.value
    if (providerValue === '') {
        alert('Kindly choose valid provider')
    } else if (amountValue === '') {
        alert('Choose a valid amount')
    } else{
    let pin = ""
    for(let i = 0; i < 12; i++){
    pin +=Math.floor(Math.random() *10)
    }   

     cardPin.innerHTML = pin

     let card = {
        pin ,
        amount: amountValue ,
        provider: providerValue ,
        isUsed: false
     }

     cardData.push(card)
     localStorage.setItem('mayRechargeCards' , JSON.stringify(cardData))
     displayCards()


    }

}



function displayCards() {
    tbody.innerHTML = ''
    cardData.forEach(( card , i , arr)=> {   
 tbody.innerHTML += ` <tr>  <td>${i + 1}</td> <td> ${card.pin}</td> <td> ${card.isUsed} </td> <td> ${card.provider} </td> <td> ${card.amount} </td> </tr> `
    })
    
}





displayCards()





function loadAirtime() {
    let inputElement = document.getElementById('loadInput').value
    console.log(inputElement.startsWith('*311*'));
    
//    correct text = *311*123456789012# 
let cardPin = inputElement.slice(5 , 17)
let foundCard = cardData.find((card, i , arr)=> { return card.pin === cardPin  })

if(!loadInput.value.trim()){
    alert('please input a card to load')
} else if (!inputElement.startsWith('*311*') || !inputElement.endsWith('#') || inputElement.trim().length !== 18) {
    alert('invalid loading format')
} else if ( !foundCard ) {
     alert('invalid card')
} else if ( foundCard.isUsed === true ){
     alert('card has already been used')
}else {
    alert (`you have successfully loaded ${foundCard.provider} of ${foundCard.amount} successfully`)
     balance = balance + Number(foundCard.amount) 
     localStorage.setItem('mayRechargeBalance' , JSON.stringify(balance))
     balSpan.innerHTML = balance    
     foundCard.isUsed = true
     localStorage.setItem('mayRechargeCards' , JSON.stringify(cardData))
     displayCards()
     
}
    
}

function usedCards() {
    let filteredUsedCards = cardData.filter(function (card, i) {
        return card.isUsed === true
       })
       tbody.innerHTML = ''
    filteredUsedCards.forEach(( card , i , arr)=> {   
 tbody.innerHTML += ` <tr>  <td>${i + 1}</td> <td> ${card.pin}</td> <td> ${card.isUsed} </td> <td> ${card.provider} </td> <td> ${card.amount} </td> </tr> `
    })
}
function unusedCards() {
    let filteredUnUsedCards = cardData.filter(function (card, i) {
        return card.isUsed === false
       })
       tbody.innerHTML = ''
    filteredUnUsedCards.forEach(( card , i , arr)=> {   
 tbody.innerHTML += ` <tr>  <td>${i + 1}</td> <td> ${card.pin}</td> <td> ${card.isUsed} </td> <td> ${card.provider} </td> <td> ${card.amount} </td> </tr> `
    })
}

let countries = [
    'Nigeria', 'Ghana', 'Kenya', 'Egypt', 'South Africa',
    'Brazil', 'Argentina', 'Mexico', 'Canada', 'United States',
    'Germany', 'France', 'Italy', 'Spain', 'United Kingdom',
    'Japan', 'China', 'India', 'Australia', 'South Korea',
    'Russia', 'Turkey', 'Saudi Arabia', 'Morocco', 'Colombia' 
]

function sendFirstLetterAndTheirAmount() {
 let singleLetters = countries.map((c) => c[0])
 console.log(singleLetters);
 let eachLetter = new Set(singleLetters)
 console.log(eachLetter);
 let finalLetterArr = Array.from(eachLetter)
 console.log(finalLetterArr);
 
let val = finalLetterArr.map(( c, i)=> {
        return {
          letter: finalLetterArr[i] ,
          count : countries.filter((country)=>  country.startsWith(finalLetterArr[i]) ).length
        }
   })

   return val
    
}


console.log(sendFirstLetterAndTheirAmount());




</script>
