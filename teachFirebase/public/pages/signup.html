<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassChat - Sign Up</title>
  <link rel="stylesheet" href="../css/landing.css">
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="subtitle">Sign up to start chatting with your class</p>

      <div class="error-message" id="signup-error"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="display-name">Display Name</label>
          <input type="text" id="display-name" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>

        <button type="button" class="btn btn-primary" id="signup-btn" onclick="signUpUser()">Sign Up</button>
      </form>

      <p class="switch-link">
        Already have an account? <a href="./login.html">Log In</a>
      </p>
    </div>
  </div>



</body>
</html>
<script src="../js/signup.js"></script>
