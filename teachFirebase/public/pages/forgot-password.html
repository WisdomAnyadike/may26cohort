<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassChat - Forgot Password</title>
  <link rel="stylesheet" href="../css/landing.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your email and we'll send you a reset link</p>

      <div class="error-message" id="reset-error"></div>
      <div class="success-message" id="reset-success"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn btn-primary" id="reset-btn">Send Reset Link</button>
      </form>

      <p class="switch-link">
        Remember your password? <a href="./login.html">Log In</a>
      </p>
    </div>
  </div>

  <!-- ADD YOUR FIREBASE + JS SCRIPTS HERE -->

</body>
</html>
